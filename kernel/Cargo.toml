[package]
name = "kernel"
version = "0.7.2"
edition = "2024"
authors = ["nfge Github: <https://github.com/nfge>"]


[dependencies]
uefi = "0.41.0"
raw-cpuid = "11.6.0"
itoa = "1.0.18"
heapless = "=0.9.3"
lock_api = "=0.4.14"
spin = "0.12.2"
jiff = { version = "0.2.37", default-features = false, features = ["alloc"] }
lazy_static = {version = "1.5.0", features = ["spin_no_std"]}

kernel_api={path = "../kernel_api", features = ["module_api", "alloc"]}

bootinfo={path = "../common/bootinfo"}
acpi = {path = "../common/acpi"}
pci={path = "../common/pci"}
utils={path = "../utils"}
linked_list_allocator = "0.10.6"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86 = "0.52.0"
x86_64 = "0.15.5"

[build-dependencies]
cc = "1.4.0"
vergen-gitcl = { version = "10", features = ["build"] }


[[bin]]
name = "kernel"
test=false
bench=false
